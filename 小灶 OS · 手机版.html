<script src="os/presence.js?v=20260629-2"></script>
<script>
  // 时钟（状态栏 + 锁屏）
  (function () {
    function p(n) { return (n < 10 ? '0' : '') + n; }
    function tick() {
      var d = new Date();
      var wd = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
      var t = p(d.getHours()) + ':' + p(d.getMinutes());
      document.getElementById('ios-clock').textContent = t;
      var lt = document.getElementById('lock-time');
      var ld = document.getElementById('lock-date');
      if (lt) lt.textContent = t;
      if (ld) ld.textContent = (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + wd;
    }
    tick();
    setInterval(tick, 15000);
  })();

  // 锁屏解锁
  (function () {
    var lock = document.getElementById('lockscreen');
    var unlocked = false;
    function unlock() {
      if (unlocked) return;
      unlocked = true;
      lock.classList.add('out');
      setTimeout(function () {
        lock.remove();
        document.body.classList.remove('is-locked');
      }, 550);
    }
    document.getElementById('lock-enter').addEventListener('click', unlock);
    window.addEventListener('keydown', function (e) {
      if (!unlocked && (e.key === 'Enter' || e.key === ' ')) unlock();
    });
  })();
</script>

</body>
