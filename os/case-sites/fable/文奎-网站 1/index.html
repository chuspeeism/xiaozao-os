  :root{
    --bg:#020a19;
    --ink:#d5e0ff;
    --ink-60:rgba(213,224,255,.6);
    --ink-35:rgba(213,224,255,.35);
    --ink-22:rgba(213,224,255,.22);
    --ink-10:rgba(213,224,255,.10);
    --deep:#052261;
    --sans:'Space Grotesk',sans-serif;
    --mono:'CommitMono','JetBrains Mono',monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  /* original scales everything off a fluid rem: 1rem = vw/120 (13.33px @1600) */
  html{font-size:clamp(9.5px,.8333vw,18px)}
  html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
    font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{user-select:none;-webkit-user-select:none;touch-action:none}
  a{color:inherit;text-decoration:none}
  button{background:none;border:0;color:inherit;font:inherit;cursor:pointer}

  #gl{position:fixed;inset:0;width:100%;height:100%;display:block}

  /* ---------- viewport hud frame ---------- */
  #frame{position:fixed;inset:2.5rem;z-index:34;pointer-events:none}
  #frame path{fill:none;stroke:var(--ink-10);stroke-width:1}

  /* ---------- type helpers ---------- */
  .mono{font-family:var(--mono);font-weight:500;font-size:.6875rem;letter-spacing:.08em;
    text-transform:uppercase;line-height:1.2}
  .mono-tight{font-family:var(--mono);font-weight:500;font-size:.6875rem;letter-spacing:.16em;
    text-transform:uppercase;line-height:1}
  .ui-bold{font-family:var(--sans);font-weight:700;font-size:.75rem;letter-spacing:.16em;
    text-transform:uppercase;line-height:1}

  /* ---------- chamfered hud buttons ---------- */
  .hud-btn{position:relative;display:inline-flex;align-items:center;gap:.7rem;
    height:3.4rem;padding:0 1.75rem;cursor:pointer;color:var(--ink);
    font-family:var(--sans);font-weight:700;font-size:.75rem;letter-spacing:.16em;
    text-transform:uppercase;transition:color .25s}
  .hud-btn svg.hud-frame{position:absolute;inset:0;width:100%;height:100%;display:block;
    pointer-events:none}
  .hud-btn .hud-fill{fill:rgba(213,224,255,.05);stroke:var(--ink-22);stroke-width:1;
    transition:fill .25s,stroke .25s}
  .hud-btn:hover .hud-fill{fill:var(--ink)}
  .hud-btn:hover{color:var(--bg)}
  .hud-btn.solid .hud-fill{fill:var(--ink);stroke:var(--ink)}
  .hud-btn.solid{color:var(--bg)}
  .hud-btn.solid:hover .hud-fill{fill:rgba(213,224,255,.08)}
  .hud-btn.solid:hover{color:var(--ink)}
  .hud-btn>*{position:relative}
  .px-ic{display:block}

  /* ---------- header ---------- */
  header{position:fixed;top:0;left:0;right:0;z-index:40;display:flex;
    justify-content:space-between;align-items:center;padding:3.1rem 4.5rem 0;
    opacity:0;transform:translateY(-.9rem);transition:opacity .9s .2s,transform .9s .2s}
  body.ready header{opacity:1;transform:none}
  .logo{display:block;cursor:pointer}
  .logo svg{display:block;width:11.6rem;height:auto;fill:var(--ink)}
  .hdr-actions{display:flex;gap:2px;align-items:center}
  .hud-btn.ghost .hud-fill{fill:rgba(213,224,255,.06);stroke:transparent}
  .hud-btn.ghost:hover .hud-fill{fill:var(--ink)}

  /* ---------- left rail ---------- */
  #rail{position:fixed;left:3.4rem;top:50%;transform:translateY(-50%);z-index:40;
    display:flex;flex-direction:column;gap:1.05rem;
    opacity:0;transition:opacity .9s .5s}
  body.ready #rail{opacity:1}
  .rail-item{display:flex;align-items:center;gap:.75rem;cursor:pointer;opacity:.3;
    transition:opacity .4s;
    font-family:var(--sans);font-weight:500;font-size:.75rem;letter-spacing:.24em;
    text-transform:uppercase;line-height:1}
  .rail-item .sq{width:.5rem;height:.5rem;border:1px solid var(--ink);transition:background .4s;
    flex:0 0 auto}
  .rail-item.active{opacity:1}
  .rail-item.active .sq{background:var(--ink)}
  .rail-item:hover{opacity:.75}

  /* ---------- copy blocks ---------- */
  .copy{position:fixed;left:50%;top:67%;transform:translate(-50%,-50%);z-index:30;
    width:min(76rem,94vw);text-align:center;opacity:0;transition:opacity .4s;pointer-events:none}
  .copy.active{opacity:1}
  .copy h1{font-family:var(--sans);font-weight:700;font-size:2.5rem;line-height:1.06;
    letter-spacing:.04em;text-transform:uppercase;color:var(--ink)}
  .copy h1 .w{display:inline-block;white-space:pre}
  .copy h1 .l{opacity:0;display:inline-block}
  .copy p{margin:1.55rem auto 0;max-width:36.5rem;
    font-family:var(--sans);font-weight:300;font-size:1rem;line-height:1.6;
    letter-spacing:-.02em;color:var(--ink-60);
    opacity:0;transform:translateY(1rem);transition:opacity .8s .3s,transform .8s .3s}
  .copy.active p{opacity:1;transform:none}
  .copy.leaving p{opacity:0;transform:translateY(-.5rem);transition:opacity .3s,transform .3s}
  .cta{margin-top:2rem;pointer-events:auto;
    opacity:0;transform:translateY(1rem);transition:opacity .8s .5s,transform .8s .5s,color .25s}
  .copy.active .cta{opacity:1;transform:translateY(0)}
  .copy.leaving .cta{opacity:0;transform:translateY(-.5rem);transition:opacity .3s,transform .3s}
  @keyframes letterIn{0%{opacity:0}12%{opacity:1}24%{opacity:.05}38%{opacity:1}
    52%{opacity:.3}68%{opacity:1}100%{opacity:1}}
  @keyframes letterOut{0%{opacity:1}25%{opacity:0}45%{opacity:.85}65%{opacity:.1}100%{opacity:0}}

  /* ---------- bottom bar ---------- */
  #bottombar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;
    justify-content:space-between;align-items:center;padding:0 4.6rem 3.5rem;
    color:rgba(213,224,255,.85);
    opacity:0;transform:translateY(.9rem);transition:opacity .9s .4s,transform .9s .4s}
  body.ready #bottombar{opacity:1;transform:none}
  .bb-slot{position:relative;height:1.1rem;min-width:13rem;display:flex;align-items:center}
  .bb-slot.r{justify-content:flex-end}
  .bb-swap{position:absolute;display:flex;align-items:center;gap:.7rem;white-space:nowrap;
    transition:opacity .6s}
  #soundBtn{cursor:pointer;display:flex;align-items:center;gap:.7rem}
  #soundBtn:hover{color:var(--ink)}
  .snd-ic{position:relative;width:1.05rem;height:1.05rem;flex:0 0 auto}
  .snd-ic i{position:absolute;left:50%;top:50%;width:.3rem;height:.3rem;margin:-.15rem 0 0 -.15rem;
    background:currentColor;border-radius:50%}
  .snd-ic b{position:absolute;inset:0;border:1px solid currentColor;border-radius:50%;opacity:.45}
  body.sound-on .snd-ic b{animation:ripple 1.8s linear infinite}
  @keyframes ripple{0%{transform:scale(.4);opacity:.8}100%{transform:scale(1.25);opacity:0}}
  #scrollHint{display:flex;align-items:center;gap:.7rem;color:rgba(213,224,255,.7);
    transition:opacity .6s;animation:hintPulse 2.6s ease-in-out infinite}
  @keyframes hintPulse{0%,100%{opacity:.85}50%{opacity:.35}}
  body.scrolled #scrollHint{opacity:0}
  #chatBtn{display:flex;align-items:center;gap:.7rem;cursor:pointer}
  #chatBtn:hover{color:var(--ink)}
  .chat-ic{width:1.15rem;height:1.15rem;border:1px solid currentColor;border-radius:50%;

<script type="module">
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

/* ============================================================ utils */
const clamp = (v,a,b)=>Math.min(b,Math.max(a,v));
const lerp = (a,b,t)=>a+(b-a)*t;
const smooth = (a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const easeIO = t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;

function makeNoise(seed=1){
  const h=(x,y)=>{
    let n=Math.sin(x*127.1+y*311.7+seed*74.7)*43758.5453;
    return n-Math.floor(n);
  };
  const n2=(x,y)=>{
    const ix=Math.floor(x),iy=Math.floor(y),fx=x-ix,fy=y-iy;
    const ux=fx*fx*(3-2*fx),uy=fy*fy*(3-2*fy);
    return lerp(lerp(h(ix,iy),h(ix+1,iy),ux),lerp(h(ix,iy+1),h(ix+1,iy+1),ux),uy);
  };
  const fbm2=(x,y,oct=4)=>{
    let v=0,a=.5;
    for(let i=0;i<oct;i++){v+=a*n2(x,y);x=x*2.03+7.3;y=y*2.03+1.7;a*=.5;}
    return v;
  };
  return {n2,fbm2};
}
const rng=(()=>{let s=1337;return()=>{s=(s*16807)%2147483647;return(s-1)/2147483646;};})();

/* ============================================================ palette */
const PAL = {
  bg:      new THREE.Color(0x020a19),
  ink:     new THREE.Color(0xd5e0ff),
  deep:    new THREE.Color(0x052261),
  ribbonA: new THREE.Color(0x0a2f86),
  ribbonB: new THREE.Color(0xbfe2ff),
  cubeBase:new THREE.Color(0x0b3fa6),
  cubeEdge:new THREE.Color(0x9fd4ff),
  cubeWisp:new THREE.Color(0x2f7fe0),
  terrBase:new THREE.Color(0x020817),
  terrLit: new THREE.Color(0x07193a),
  terrRim: new THREE.Color(0x16498f),
};

/* ============================================================ GLSL chunks */
const GLSL_NOISE = /* glsl */`
float h21(vec2 p){p=fract(p*vec2(123.34,456.21));p+=dot(p,p+45.32);return fract(p.x*p.y);}
float n2(vec2 p){vec2 i=floor(p),f=fract(p);vec2 u=f*f*(3.-2.*f);
  return mix(mix(h21(i),h21(i+vec2(1.,0.)),u.x),mix(h21(i+vec2(0.,1.)),h21(i+vec2(1.,1.)),u.x),u.y);}
float fbm(vec2 p){float v=0.,a=.5;
  for(int k=0;k<4;k++){v+=a*n2(p);p=p*2.03+vec2(7.3,1.7);a*=.5;}return v;}
float h31(vec3 p){p=fract(p*.3183099+.1);p*=17.;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float n3(vec3 p){vec3 i=floor(p),f=fract(p);vec3 u=f*f*(3.-2.*f);
  return mix(mix(mix(h31(i),h31(i+vec3(1,0,0)),u.x),mix(h31(i+vec3(0,1,0)),h31(i+vec3(1,1,0)),u.x),u.y),
             mix(mix(h31(i+vec3(0,0,1)),h31(i+vec3(1,0,1)),u.x),mix(h31(i+vec3(0,1,1)),h31(i+vec3(1,1,1)),u.x),u.y),u.z);}
float fbm3(vec3 p){float v=0.,a=.5;for(int k=0;k<3;k++){v+=a*n3(p);p=p*2.02+11.;a*=.5;}return v;}
`;

/* ============================================================ renderer */
const canvas = document.getElementById('gl');
const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setClearColor(PAL.bg, 1);
renderer.toneMapping = THREE.NoToneMapping;
const DPR = Math.min(window.devicePixelRatio||1, 1.75);
renderer.setPixelRatio(DPR);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, 1, .1, 2400);

const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(1,1), .7, .42, .42);
composer.addPass(bloom);
const gradePass = new ShaderPass({
  uniforms:{tDiffuse:{value:null},uTime:{value:0},uRes:{value:new THREE.Vector2(1,1)}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader:`
    uniform sampler2D tDiffuse;uniform float uTime;uniform vec2 uRes;varying vec2 vUv;
    void main(){
      vec4 c=texture2D(tDiffuse,vUv);
      vec2 q=vUv-.5;
      float v=1.-dot(q,q)*1.3;
      c.rgb*=clamp(v,0.,1.)*.9+.1;
      float lum=dot(c.rgb,vec3(.299,.587,.114));
      c.rgb=mix(vec3(lum),c.rgb,1.38);
      float g=fract(sin(dot(vUv*uRes+mod(uTime,10.)*123.4,vec2(12.9898,78.233)))*43758.5453);
      c.rgb+=(g-.5)*.022;
      gl_FragColor=c;
    }`
});
composer.addPass(new OutputPass());
composer.addPass(gradePass); // grain/vignette in sRGB space so blacks stay black

const camTrackedMats=[]; // materials that need uCam updated

/* ============================================================ texture helpers */
function radialTex(stops, size=256){
  const cv=document.createElement('canvas');cv.width=cv.height=size;
  const cx=cv.getContext('2d');
  const g=cx.createRadialGradient(size/2,size/2,0,size/2,size/2,size/2);
  for(const [o,c] of stops) g.addColorStop(o,c);
  cx.fillStyle=g;cx.fillRect(0,0,size,size);
  const t=new THREE.CanvasTexture(cv);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
const glowTex = radialTex([[0,'rgba(170,215,255,1)'],[ .25,'rgba(80,140,240,.5)'],[ .6,'rgba(20,50,140,.12)'],[1,'rgba(0,0,0,0)']]);

/* tech-panel detail texture for the glowing cubes (etched seams + insets) */
function panelTexture(){
  const cv=document.createElement('canvas');cv.width=cv.height=256;
  const cx=cv.getContext('2d');
  cx.fillStyle='#fff';cx.fillRect(0,0,256,256);
  let s=7;const rnd=()=>{s=(s*16807)%2147483647;return (s-1)/2147483646;};
  cx.strokeStyle='rgb(132,132,132)';cx.lineWidth=2.5;
  for(let i=0;i<9;i++){
    cx.strokeRect(rnd()*195,rnd()*195,22+rnd()*70,16+rnd()*52);
  }
  cx.fillStyle='rgb(168,168,168)';
  for(let i=0;i<7;i++){cx.fillRect(rnd()*230,rnd()*230,6+rnd()*16,6+rnd()*16);}
  cx.lineWidth=3.5;
  cx.beginPath();cx.moveTo(36,214);cx.lineTo(122,128);cx.stroke();
  cx.beginPath();cx.moveTo(150,70);cx.lineTo(204,70);cx.stroke();
  const t=new THREE.CanvasTexture(cv);
  t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
const panelTex=panelTexture();

/* ============================================================ ribbon */
function makeRibbon({points, width=3, segments=220, mode='screen', colA=PAL.ribbonA, colB=PAL.ribbonB,
                     speed=.35, freq=5, sharp=2.2, intensity=1, sway=0, seed=0}){
  const curve=new THREE.CatmullRomCurve3(points);
  const pts=curve.getSpacedPoints(segments);
  const pos=[],uv=[],idx=[];
  const up=new THREE.Vector3(0,1,0), zax=new THREE.Vector3(0,0,1);
  const side=new THREE.Vector3();
  for(let i=0;i<=segments;i++){
    const p=pts[i];
    const t=curve.getTangent(i/segments).normalize();
    if(mode==='flat') side.crossVectors(t,up); else side.crossVectors(t,zax);
    if(side.lengthSq()<1e-5) side.set(1,0,0);
    side.normalize().multiplyScalar(width*.5);
    pos.push(p.x+side.x,p.y+side.y,p.z+side.z, p.x-side.x,p.y-side.y,p.z-side.z);
    uv.push(i/segments,0, i/segments,1);
  }
  for(let i=0;i<segments;i++){const a=i*2;idx.push(a,a+1,a+2, a+1,a+3,a+2);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  const m=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, side:THREE.DoubleSide, blending:THREE.AdditiveBlending,
    uniforms:{
      uTime:{value:0}, uFade:{value:1},
      uColA:{value:colA}, uColB:{value:colB},
      uSpeed:{value:speed}, uFreq:{value:freq}, uSharp:{value:sharp}, uInt:{value:intensity},
      uSway:{value:sway}, uSeed:{value:seed},
    },
    vertexShader:`varying vec2 vUv;
      uniform float uTime,uSway,uSeed;
      void main(){vUv=uv;
        vec3 p=position;
        p.x+=sin(p.y*.14+uTime*.65+uSeed)*uSway;
        p.z+=cos(p.y*.11+uTime*.5+uSeed*1.7)*uSway*.6;
        gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
    fragmentShader: GLSL_NOISE + `
      varying vec2 vUv;
      uniform float uTime,uFade,uSpeed,uFreq,uSharp,uInt;
      uniform vec3 uColA,uColB;
      void main(){
        float core=pow(max(0.,1.-abs(vUv.y*2.-1.)),uSharp);
        float ends=smoothstep(0.,.14,vUv.x)*(1.-smoothstep(.86,1.,vUv.x));
        float flow=fbm(vec2(vUv.x*uFreq-uTime*uSpeed, vUv.y*2.+uTime*.05));
        float flow2=fbm(vec2(vUv.x*uFreq*2.7+uTime*uSpeed*.6, vUv.y*4.));
        float a=core*ends*(.25+.95*flow)*(.6+.5*flow2)*uInt*uFade;
        vec3 col=mix(uColA,uColB,pow(core,2.))*(.55+.85*flow);
        gl_FragColor=vec4(col*a,a);
      }`
  });
  return new THREE.Mesh(g,m);
}

/* ============================================================ terrain */
function makeTerrain({w,d,segW=180,segD=120,cz=0,heightFn,
                      base=PAL.terrBase,lit=PAL.terrLit,rimCol=PAL.terrRim,
                      rim=.4,fogNear=220,fogFar=700,flat=0,
                      point=null,pointCol=0x2f7fe0,pointInt=0,pointK=.012}){
  const g=new THREE.PlaneGeometry(w,d,segW,segD);
  g.rotateX(-Math.PI/2);
  g.translate(0,0,cz);
  const p=g.attributes.position;
  for(let i=0;i<p.count;i++){
    p.setY(i, heightFn(p.getX(i), p.getZ(i)));
  }
  g.computeVertexNormals();
  const m=new THREE.ShaderMaterial({
    uniforms:{
      uCam:{value:new THREE.Vector3()}, uFade:{value:1},
      uBase:{value:base}, uLit:{value:lit}, uRimCol:{value:rimCol},
      uRim:{value:rim}, uBg:{value:PAL.bg},
      uFogNear:{value:fogNear}, uFogFar:{value:fogFar},
      uLightDir:{value:new THREE.Vector3(.25,.8,.45).normalize()},
      uFlat:{value:flat},
      uPoint:{value:point||new THREE.Vector3()},
      uPointCol:{value:new THREE.Color(pointCol)},
      uPointInt:{value:point?pointInt:0}, uPointK:{value:pointK},
    },
    vertexShader:`
      varying vec3 vN;varying vec3 vW;
      void main(){
        vN=normalize(mat3(modelMatrix)*normal);
        vec4 wp=modelMatrix*vec4(position,1.);vW=wp.xyz;
        gl_Position=projectionMatrix*viewMatrix*wp;
      }`,
    fragmentShader:`
      varying vec3 vN;varying vec3 vW;
      uniform vec3 uCam,uBase,uLit,uRimCol,uBg,uLightDir,uPoint,uPointCol;
      uniform float uRim,uFogNear,uFogFar,uFade,uFlat,uPointInt,uPointK;
      void main(){
        vec3 n=normalize(vN);
        if(uFlat>.5){
          n=normalize(cross(dFdx(vW),dFdy(vW)));
          if(n.y<0.)n=-n;
        }
        vec3 V=normalize(uCam-vW);
        float diff=max(dot(n,uLightDir),0.);
        float rim=pow(1.-abs(dot(n,V)),3.);
        vec3 col=mix(uBase,uLit,diff*.85);
        col+=uRimCol*rim*uRim;
        if(uPointInt>0.){
          vec3 PL=uPoint-vW;
          col+=uPointCol*max(dot(n,normalize(PL)),0.)*exp(-length(PL)*uPointK)*uPointInt;
        }
        float dist=distance(uCam,vW);
        col=mix(col,uBg,smoothstep(uFogNear,uFogFar,dist));
        col=mix(uBg,col,uFade);
        gl_FragColor=vec4(col,1.);
      }`
  });
  camTrackedMats.push(m);
  return new THREE.Mesh(g,m);
}

/* ============================================================ particles */
function makeParticles({count=300, box=[200,40,300], center=[0,10,-100],
                        size=2, col=new THREE.Color(0x9cc8ff), intensity=.8, drift=1}){
  const pos=new Float32Array(count*3), aSize=new Float32Array(count),
        aPhase=new Float32Array(count), aSpeed=new Float32Array(count);
  for(let i=0;i<count;i++){
    pos[i*3]  =center[0]+(rng()-.5)*box[0];
    pos[i*3+1]=center[1]+(rng()-.5)*box[1];
    pos[i*3+2]=center[2]+(rng()-.5)*box[2];
    aSize[i]=size*(.4+rng()*1.2);
    aPhase[i]=rng()*Math.PI*2;
    aSpeed[i]=.4+rng()*1.2;
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('aSize',new THREE.BufferAttribute(aSize,1));
  g.setAttribute('aPhase',new THREE.BufferAttribute(aPhase,1));
  g.setAttribute('aSpeed',new THREE.BufferAttribute(aSpeed,1));
  const m=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{uTime:{value:0},uFade:{value:1},uCol:{value:col},uInt:{value:intensity},
      uPx:{value:DPR},uDrift:{value:drift}},
    vertexShader:`
      attribute float aSize;attribute float aPhase;attribute float aSpeed;
      uniform float uTime,uPx,uDrift;varying float vTw;
      void main(){
        vec3 p=position;
        p.y+=sin(uTime*.22*aSpeed+aPhase)*1.6*uDrift;
        p.x+=sin(uTime*.15*aSpeed+aPhase*1.7)*1.3*uDrift;
        vec4 mv=modelViewMatrix*vec4(p,1.);
        gl_PointSize=aSize*uPx*(170./max(1.,-mv.z));
        vTw=.5+.5*sin(uTime*(0.7+aSpeed)+aPhase*3.1);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      uniform vec3 uCol;uniform float uFade,uInt;varying float vTw;
      void main(){
        vec2 q=gl_PointCoord-.5;
        float a=smoothstep(.5,.08,length(q))*vTw*uFade*uInt;
        gl_FragColor=vec4(uCol*a,a);
      }`
  });
  return new THREE.Points(g,m);
}

/* ============================================================ glow cube */
/* procedural "studio" environment so the glass picks up specular streaks */
let _env=null;
function glassEnv(){
  if(_env)return _env;
  const es=new THREE.Scene();
  es.background=new THREE.Color(0x010510);
  const quad=(w,h,c,i,x,y,z,rx,ry)=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),
      new THREE.MeshBasicMaterial({color:new THREE.Color(c).multiplyScalar(i)}));
    m.position.set(x,y,z);m.rotation.set(rx,ry,0);es.add(m);
  };
  quad(14,5,0xbfe2ff,8,0,9,0,-Math.PI/2,0);    // top softbox
  quad(3,16,0x7fb8ff,5,-10,2,0,0,Math.PI/2);   // left strip
  quad(3,16,0x2f6fd0,3.5,10,1,0,0,-Math.PI/2); // right strip
  quad(24,4,0x1d5fd0,1.6,0,1,-12,0,0);         // horizon band behind
  quad(10,3,0x9fd4ff,4,0,-3,10,.6,Math.PI);  // low front fill
  const pm=new THREE.PMREMGenerator(renderer);
  _env=pm.fromScene(es,.05).texture;
  pm.dispose();
  return _env;
}

const ANIM_CUBES=[];
function makeGlowCube(size){
  // frosted refractive shell with nested counter-rotating layers inside:
  // physical transmission glass outside; inner layers render to the
  // transmission backdrop, so they show through blurred + refracted
  const grp=new THREE.Group();

  const outer=new THREE.Mesh(
    new RoundedBoxGeometry(size,size,size,4,size*.06),
    new THREE.MeshPhysicalMaterial({
      color:0xcfe2ff,
      metalness:0,
      roughness:.28,
      roughnessMap:panelTex,        // etched seams read as sharper streaks
      transmission:1,
      thickness:size*.5,
      ior:1.45,
      attenuationColor:new THREE.Color(0x7fb4f4),
      attenuationDistance:size*3,
      envMap:glassEnv(),
      envMapIntensity:2.2,
      specularIntensity:1.2,
      clearcoat:.5,
      clearcoatRoughness:.25,
      emissive:new THREE.Color(0x0e3d8f),
      emissiveIntensity:.55,
    }));
  grp.add(outer);

  const innerShell=(sz,baseHex,edgeHex,op)=>{
    const m=new THREE.ShaderMaterial({
      transparent:false,depthWrite:false,blending:THREE.AdditiveBlending,
      uniforms:{
        uTime:{value:0},uFade:{value:1},uCam:{value:new THREE.Vector3()},
        uBase:{value:new THREE.Color(baseHex)},uEdge:{value:new THREE.Color(edgeHex)},
        uOp:{value:op},
      },
      vertexShader:`
        varying vec3 vN;varying vec3 vW;varying vec3 vO;
        void main(){vO=position;
          vN=normalize(mat3(modelMatrix)*normal);
          vec4 wp=modelMatrix*vec4(position,1.);vW=wp.xyz;
          gl_Position=projectionMatrix*viewMatrix*wp;}`,
      fragmentShader:GLSL_NOISE+`
        varying vec3 vN;varying vec3 vW;varying vec3 vO;
        uniform vec3 uCam,uBase,uEdge;uniform float uTime,uFade,uOp;
        void main(){
          vec3 n=normalize(vN)*(gl_FrontFacing?1.:-1.);
          vec3 V=normalize(uCam-vW);
          float fr=pow(1.-max(dot(n,V),0.),2.);
          float w=fbm3(vO*.25+vec3(0.,uTime*.08,uTime*.05));
          vec3 col=uBase*.6+uEdge*fr*1.4+uEdge*w*.35;
          float a=(.16+.62*fr+.22*w)*uOp*uFade*(gl_FrontFacing?1.:.5);
          gl_FragColor=vec4(col*a,a);
        }`});
    camTrackedMats.push(m);
    const g2=new THREE.BoxGeometry(sz,sz,sz);
    const grp2=new THREE.Group();
    const mesh=new THREE.Mesh(g2,m);mesh.material.side=THREE.DoubleSide;
    grp2.add(mesh);
    const edges=new THREE.LineSegments(new THREE.EdgesGeometry(g2),
      new THREE.ShaderMaterial({
        transparent:false,depthWrite:false,blending:THREE.AdditiveBlending,
        uniforms:{uFade:{value:1},uCol:{value:new THREE.Color(edgeHex)}},
        vertexShader:`void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
        fragmentShader:`uniform vec3 uCol;uniform float uFade;
          void main(){gl_FragColor=vec4(uCol*uFade*.8,uFade*.8);}`}));
    grp2.add(edges);
    return grp2;
  };

  const mid=innerShell(size*.62,0x1450c0,0xb4dcff,1.4);
  grp.add(mid);

  const core=new THREE.Group();
  const coreMat=new THREE.ShaderMaterial({
    transparent:false,depthWrite:false,blending:THREE.AdditiveBlending,
    uniforms:{uTime:{value:0},uFade:{value:1},uCore:{value:new THREE.Color(0xbfe4ff)}},
    vertexShader:`varying vec3 vO;void main(){vO=position;
      gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
    fragmentShader:GLSL_NOISE+`
      varying vec3 vO;uniform float uTime,uFade;uniform vec3 uCore;
      void main(){
        float w=fbm3(vO*.5+vec3(uTime*.12,uTime*.07,0.));
        float a=(.45+.55*w)*uFade;
        gl_FragColor=vec4(uCore*a,a);
      }`});
  const coreGeo=new THREE.BoxGeometry(size*.34,size*.34,size*.34);
  core.add(new THREE.Mesh(coreGeo,coreMat));
  core.add(new THREE.LineSegments(new THREE.EdgesGeometry(coreGeo),
    new THREE.ShaderMaterial({
      transparent:false,depthWrite:false,blending:THREE.AdditiveBlending,
      uniforms:{uFade:{value:1},uCol:{value:new THREE.Color(0xeaf6ff)}},
      vertexShader:`void main(){gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
      fragmentShader:`uniform vec3 uCol;uniform float uFade;
        void main(){gl_FragColor=vec4(uCol*uFade,uFade);}`})));
  grp.add(core);

  const heart=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:false,
    opacity:.85,blending:THREE.AdditiveBlending,depthWrite:false,color:0x8fc8ff}));
  heart.scale.setScalar(size*1.15);
  grp.add(heart);

  const rim=new THREE.Mesh(
    new RoundedBoxGeometry(size*1.004,size*1.004,size*1.004,4,size*.06),
    new THREE.ShaderMaterial({
      transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
      uniforms:{uFade:{value:1},uCam:{value:new THREE.Vector3()},
        uCol:{value:new THREE.Color(0x9fd4ff)}},
      vertexShader:`
        varying vec3 vN;varying vec3 vW;
        void main(){
          vN=normalize(mat3(modelMatrix)*normal);
          vec4 wp=modelMatrix*vec4(position,1.);vW=wp.xyz;
          gl_Position=projectionMatrix*viewMatrix*wp;}`,
      fragmentShader:`
        varying vec3 vN;varying vec3 vW;
        uniform vec3 uCam,uCol;uniform float uFade;
        void main(){
          vec3 V=normalize(uCam-vW);
          float fr=pow(1.-max(dot(normalize(vN),V),0.),3.5);
          gl_FragColor=vec4(uCol*fr*.9*uFade,fr*.9*uFade);
        }`}));
  camTrackedMats.push(rim.material);
  grp.add(rim);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:glowTex,transparent:true,
    opacity:.18,blending:THREE.AdditiveBlending,depthWrite:false,color:0x4fa0ff}));
  halo.scale.setScalar(size*3);
  grp.add(halo);

  ANIM_CUBES.push({mid,core,phase:ANIM_CUBES.length*1.7});
  return grp;
}

function glowSprite(scale, opacity=.5){
  const m=new THREE.MeshBasicMaterial({map:glowTex, transparent:true, opacity,
    blending:THREE.AdditiveBlending, depthWrite:false});
  const q=new THREE.Mesh(new THREE.PlaneGeometry(1,1),m);
  q.scale.setScalar(scale);
  return q;
}

/* ============================================================ scenes */
const SCENE_GAP=4000;
const builders=[];
const N1=makeNoise(7),N2=makeNoise(23),N3=makeNoise(51),N4=makeNoise(88);
const PI=Math.PI;

/* ---------- 1 · FUTURE — glass cube over water ---------- */
builders.push(function buildFuture(gx){
  const g=new THREE.Group(); g.position.x=gx; scene.add(g);

  // water
  const wgeo=new THREE.PlaneGeometry(1300,1000,1,1);
  wgeo.rotateX(-PI/2); wgeo.translate(0,0,-300);
  const wmat=new THREE.ShaderMaterial({
    uniforms:{
      uTime:{value:0},uFade:{value:1},uCam:{value:new THREE.Vector3()},
      uBg:{value:PAL.bg},
      uCube:{value:new THREE.Vector3(0,10.5,-58)},
      uGlowPos:{value:new THREE.Vector3(0,26,-690)},
      uDeep:{value:new THREE.Color(0x020c1f)},
      uGlowCol:{value:new THREE.Color(0x2a66c4)},
      uCubeCol:{value:new THREE.Color(0x3d8af0)},
      uOff:{value:gx},
    },
    vertexShader:`
      varying vec3 vW;varying vec2 vL;
      void main(){
        vec4 wp=modelMatrix*vec4(position,1.);vW=wp.xyz;
        vL=position.xz;
        gl_Position=projectionMatrix*viewMatrix*wp;
      }`,
    fragmentShader: GLSL_NOISE + `
      varying vec3 vW;varying vec2 vL;
      uniform vec3 uCam,uBg,uCube,uGlowPos,uDeep,uGlowCol,uCubeCol;
      uniform float uTime,uFade,uOff;
      void main(){
        vec2 p=vL;
        float e=.9;
        vec2 fl=vec2(uTime*.06,uTime*.025);
        float h0=fbm(p*.045+fl);
        float hx=fbm((p+vec2(e,0.))*.045+fl);
        float hz=fbm((p+vec2(0.,e))*.045+fl);
        vec3 n=normalize(vec3(-(hx-h0)/e*2.2,1.,-(hz-h0)/e*2.2));
        vec3 V=normalize(uCam-vW);
        vec3 lw=uGlowPos;lw.x+=uOff;
        vec3 L=normalize(lw-vW);
        vec3 H=normalize(L+V);
        float spec=pow(max(dot(n,H),0.),140.)*.9+pow(max(dot(n,H),0.),18.)*.14;
        // cube reflection streak (elongated toward camera)
        vec2 d=vec2(p.x-uCube.x,p.y-uCube.z);
        float shim=.45+.75*fbm(vec2(p.x*.25,p.y*.12-uTime*.5));
        float refl=exp(-abs(d.x)*.26)*exp(-abs(d.y)*.02)*step(uCube.z-8.,p.y)*shim;
        // horizon band
        float horiz=smoothstep(-260.,-560.,p.y)*exp(-abs(p.x)*.004);
        // sparkles
        float sp=smoothstep(.945,1.,n2(p*1.3+vec2(uTime*.35,-uTime*.22)));
        float tw=.5+.5*sin(uTime*3.+h21(floor(p*1.3))*40.);
        float sp2=smoothstep(.962,1.,n2(p*2.3+vec2(3.7,9.1)));
        float tw2=.5+.5*sin(uTime*2.1+h21(floor(p*2.3+3.7))*40.);
        vec3 col=uDeep*(.24+.42*h0);
        col+=uGlowCol*spec;
        col+=uCubeCol*refl*.4;
        col=mix(col,uGlowCol*.9,horiz*.7);
        col+=vec3(.65,.8,1.)*sp*tw*.4;
        col+=vec3(.75,.88,1.)*sp2*tw2*.5;
        float dist=distance(uCam,vW);
        col=mix(col,uBg,smoothstep(330.,720.,dist));
        col=mix(uBg,col,uFade);
        gl_FragColor=vec4(col,1.);
      }`
  });
  camTrackedMats.push(wmat);
  g.add(new THREE.Mesh(wgeo,wmat));

  // mountains
  const mh=(x,z)=>{
    const m=smooth(50,240,Math.abs(x));
    if(m<=0)return -3;
    const r=Math.pow(N1.fbm2(x*.012,z*.012),1.45);
    return m*(14+52*r)+m*N1.fbm2(x*.05,z*.05)*7-3;
  };
  g.add(makeTerrain({w:1400,d:900,segW:200,segD:130,cz:-440,heightFn:mh,
    base:new THREE.Color(0x020713),lit:new THREE.Color(0x051124),rim:.32,flat:1,
    point:new THREE.Vector3(0,10.5,-58),pointCol:0x2f7fe0,pointInt:1.1,pointK:.011,
    fogNear:260,fogFar:820}));

  // star-dots on the black water + shore lights at the mountain feet
  {
    const wpos=[];
    for(let i=0;i<460;i++){
      const x=(rng()-.5)*420, z=30-rng()*420;
      wpos.push(x,.45,z);
    }
    const wp=makeParticles({count:wpos.length/3,size:1.25,intensity:1.05,drift:.12,
      col:new THREE.Color(0xcfe2ff)});
    wp.geometry.setAttribute('position',new THREE.Float32BufferAttribute(wpos,3));
    g.add(wp);
    const spos=[];
    let guard=0;
    while(spos.length<210*3&&guard++<8000){
      const x=(rng()<.5?-1:1)*(55+rng()*180), z=-40-rng()*380;
      const y=mh(x,z);
      if(y>.5&&y<13)spos.push(x,y+.4,z);
    }
    const sp=makeParticles({count:spos.length/3,size:1.1,intensity:.85,drift:.08,
      col:new THREE.Color(0x9fc6ff)});
    sp.geometry.setAttribute('position',new THREE.Float32BufferAttribute(spos,3));
    g.add(sp);
  }

  // horizon glow
  const hg=glowSprite(900,.32); hg.position.set(0,40,-700); hg.scale.y=240; g.add(hg);
  const hg2=glowSprite(330,.7); hg2.position.set(0,24,-695); hg2.scale.y=95; g.add(hg2);

  // cube
  const cube=makeGlowCube(17); cube.position.set(0,11.5,-58); g.add(cube);
  const under=glowSprite(58,.28); under.rotation.x=-PI/2; under.position.set(0,.6,-52); g.add(under);

  g.add(makeParticles({count:230,box:[260,26,420],center:[0,9,-160],size:1.5,intensity:.45}));
  g.add(makeParticles({count:120,box:[700,120,500],center:[0,120,-480],size:1.1,intensity:.22}));

  return {
    group:g,
    anchor:new THREE.Vector3(0,11.5,-58),
    pose(t){
      return {
        pos:new THREE.Vector3(0, 4.5+2.5*t, 40-26*easeIO(t)),
        tar:new THREE.Vector3(0, 9.5-1.5*t, -60),
      };
    },
    tick(time){
      cube.rotation.y=time*.12;
      cube.rotation.x=Math.sin(time*.21)*.06;
      cube.position.y=11.5+Math.sin(time*.5)*.9;
      wmat.uniforms.uCube.value.copy(cube.position);
    }
  };
});

/* ---------- 2 · INNOVATION — swirling wisp ---------- */
builders.push(function buildInnovation(gx){
  const g=new THREE.Group(); g.position.x=gx; scene.add(g);
  const base=[
    new THREE.Vector3(-3,-24,0), new THREE.Vector3(-9,-12,3),
    new THREE.Vector3(7,-3,-4), new THREE.Vector3(-8,6,4),
    new THREE.Vector3(4,15,-2), new THREE.Vector3(-1,24,0),
  ];
  const widths=[7,5.4,4.2,3.2,2.5,1.9,1.5,1.1,.8];
  const wispB=new THREE.Color(0x7db8ff), coreB=new THREE.Color(0xe8f4ff);
  for(let i=0;i<widths.length;i++){
    const pts=base.map(p=>new THREE.Vector3(
      p.x+(rng()-.5)*5,(p.y+(rng()-.5)*4)*(0.92+rng()*.16),p.z+(rng()-.5)*5));
    g.add(makeRibbon({points:pts,width:widths[i],segments:260,mode:'screen',
      speed:.18+rng()*.4,freq:3.5+rng()*3,sharp:1.8+rng()*2,
      colA:new THREE.Color(0x0a3fa0),colB:i>=widths.length-2?coreB:wispB,
      intensity:.45+(i/widths.length)*.75}));
  }
  // particle stream along the curve
  const curve=new THREE.CatmullRomCurve3(base);
  const cnt=420,pos=new Float32Array(cnt*3);
  for(let i=0;i<cnt;i++){
    const p=curve.getPoint(rng());
    pos[i*3]=p.x+(rng()-.5)*9;pos[i*3+1]=p.y+(rng()-.5)*7;pos[i*3+2]=p.z+(rng()-.5)*9;
  }
  const pp=makeParticles({count:1,box:[1,1,1],center:[0,0,0],size:1.6,intensity:.8});
  // overwrite positions with stream layout
  {
    const gg=pp.geometry;
    const aSize=new Float32Array(cnt),aPhase=new Float32Array(cnt),aSpeed=new Float32Array(cnt);
    for(let i=0;i<cnt;i++){aSize[i]=1.1+rng()*2;aPhase[i]=rng()*PI*2;aSpeed[i]=.4+rng()*1.4;}
    gg.setAttribute('position',new THREE.BufferAttribute(pos,3));
    gg.setAttribute('aSize',new THREE.BufferAttribute(aSize,1));
    gg.setAttribute('aPhase',new THREE.BufferAttribute(aPhase,1));
    gg.setAttribute('aSpeed',new THREE.BufferAttribute(aSpeed,1));
  }
  g.add(pp);
  // soft volumetric smoke puffs hugging the curve
  {
    const puffGeo=new THREE.PlaneGeometry(1,1);
    for(let i=0;i<22;i++){
      const tt=i/21;
      const c=curve.getPoint(tt);
      const m=new THREE.ShaderMaterial({
        transparent:true,depthWrite:false,blending:THREE.AdditiveBlending,
        uniforms:{uTime:{value:0},uFade:{value:1},
          uC:{value:new THREE.Vector3(c.x+(rng()-.5)*5,c.y+(rng()-.5)*4,c.z+(rng()-.5)*5)},
          uS:{value:6+rng()*9},uSeed:{value:rng()*40},uInt:{value:.26+rng()*.18},
          uColA:{value:new THREE.Color(0x0a2f86)},uColB:{value:new THREE.Color(0x6fb4ff)}},
        vertexShader:`varying vec2 vUv;uniform vec3 uC;uniform float uS;
          void main(){vUv=uv;
            vec4 mv=modelViewMatrix*vec4(uC,1.);
            mv.xy+=position.xy*uS;
            gl_Position=projectionMatrix*mv;}`,
        fragmentShader:GLSL_NOISE+`varying vec2 vUv;
          uniform float uTime,uFade,uSeed,uInt;uniform vec3 uColA,uColB;
          void main(){
            float r=length(vUv-.5)*2.;
            float fall=smoothstep(.95,.12,r);
            float nn=fbm(vUv*3.+uSeed+vec2(uTime*.05,-uTime*.04));
            float a=fall*(.1+.32*nn)*uInt*uFade;
            vec3 col=mix(uColA,uColB,nn*1.2);
            gl_FragColor=vec4(col*a,a);
          }`});
      g.add(new THREE.Mesh(puffGeo,m));
    }
  }
  const halo=glowSprite(110,.09);halo.position.set(0,0,-14);g.add(halo);

  return {
    group:g,
    anchor:new THREE.Vector3(0,0,0),
    pose(t){
      const a=(-.22+.44*easeIO(t));
      return {
        pos:new THREE.Vector3(Math.sin(a)*52, -3+7*t, Math.cos(a)*52),
        tar:new THREE.Vector3(0, 1+2*t, 0),
      };
    },
    tick(){}
  };
});

  g.add(makeTerrain({w:1300,d:1100,segW:200,segD:170,cz:-220,heightFn:bh,
    rim:.4,fogNear:260,fogFar:900,
    point:new THREE.Vector3(0,8,-140),pointCol:0x2466c8,pointInt:.85,pointK:.007}));
  // settlement cluster centers (defined below) get pools of light after scatter

  const centers=[];
  for(let i=0;i<22;i++){
    const a=rng()*PI*2, r=20+rng()*140;
    centers.push([Math.cos(a)*r*1.25, -140+Math.sin(a)*r]);
  }
  const dots=[];const dotSize=[];const dotPhase=[];const dotSpeed=[];

  {

  for(let i=0;i<6;i++){

      transparent:true,opacity:.3,blending:THREE.AdditiveBlending,depthWrite:false})));
  }
  g.add(makeParticles({count:170,box:[800,70,400],center:[0,150,-350],size:.9,
    intensity:.3,drift:.1}));
  // foreground waves
  g.add(makeRibbon({points:[
    new THREE.Vector3(-360,-10,150),new THREE.Vector3(-170,26,100),
    new THREE.Vector3(10,-12,128),new THREE.Vector3(180,28,90),
    new THREE.Vector3(360,-2,140)],
    width:26,segments:300,mode:'screen',speed:.5,freq:6,sharp:2,intensity:3,
    colB:new THREE.Color(0xd9efff)}));
  g.add(makeRibbon({points:[
    new THREE.Vector3(-360,-6,152),new THREE.Vector3(-160,24,102),
    new THREE.Vector3(20,-8,130),new THREE.Vector3(190,26,92),
    new THREE.Vector3(360,2,142)],
    width:2,segments:300,mode:'screen',speed:.8,freq:8,sharp:1.5,intensity:2.6,
    colB:new THREE.Color(0xf4faff)}));
  g.add(makeRibbon({points:[
    new THREE.Vector3(-360,8,40),new THREE.Vector3(-140,-8,10),
    new THREE.Vector3(60,16,30),new THREE.Vector3(340,-4,0)],
    width:8,segments:260,mode:'screen',speed:.7,freq:7,sharp:2,intensity:1.3}));
  g.add(makeParticles({count:260,box:[500,80,500],center:[0,30,-160],size:1.8,intensity:.45}));
  return {
    group:g,
    anchor:new THREE.Vector3(0,2,-140),
    pose(t){
      return {
        pos:new THREE.Vector3(0, 68-14*easeIO(t), 158-45*easeIO(t)),

      };

});

/* ============================================================ fade application */
function applyFade(sc,f){
  const vis=f>.003;
  if(sc.group.visible!==vis)sc.group.visible=vis;
  if(!vis)return;
  if(sc._lastFade!==undefined&&Math.abs(sc._lastFade-f)<.0015)return;
  sc._lastFade=f;
  sc.group.traverse(o=>{
    const m=o.material;if(!m)return;
    if(m.uniforms&&m.uniforms.uFade)m.uniforms.uFade.value=f;
    else if(m.transparent!==undefined){
      if(o.userData.baseOp===undefined)o.userData.baseOp=m.opacity;
      m.opacity=o.userData.baseOp*f;
    }
  });
}

let copyState=-1;
const leaveTimers=new Map();
function setCopy(i){
  if(copyState===i)return;
  if(copyState>=0){
    const old=copyEls[copyState];
    old.classList.add('leaving');
    old.querySelectorAll('.l').forEach(l=>{
      l.style.animation='none';void l.offsetWidth;
      l.style.animation=`letterOut .5s ${(Math.random()*.28).toFixed(2)}s linear forwards`;
    });
    clearTimeout(leaveTimers.get(old));
    leaveTimers.set(old,setTimeout(()=>{old.classList.remove('active','leaving');},850));
  }
  copyState=i;
  if(i>=0){
    const el=copyEls[i];
    clearTimeout(leaveTimers.get(el));
    el.classList.remove('leaving');
    el.classList.add('active');
    el.querySelectorAll('.l').forEach(l=>{
      l.style.animation='none';void l.offsetWidth;
      l.style.animation=`letterIn .85s ${(Math.random()*.55).toFixed(2)}s linear forwards`;
    });
  }
}

/* chamfered hud borders (buttons + viewport frame) */
function dressHud(){
  document.querySelectorAll('.hud-btn').forEach(b=>{
    let svg=b.querySelector('svg.hud-frame');
    if(!svg){
      svg=document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('class','hud-frame');
      const path=document.createElementNS('http://www.w3.org/2000/svg','path');
      path.setAttribute('class','hud-fill');
      svg.appendChild(path);
      b.prepend(svg);
    }
    const w=b.offsetWidth,h=b.offsetHeight;
    if(!w||!h)return;
    const c=Math.min(12,h*.3);
    const cut=b.dataset.cut||'both';
    let d;
    if(cut==='none')d=`M.5 .5 H${w-.5} V${h-.5} H.5 Z`;
    else if(cut==='tr')d=`M.5 .5 H${w-c} L${w-.5} ${c} V${h-.5} H.5 Z`;
    else d=`M.5 .5 H${w-c} L${w-.5} ${c} V${h-.5} H${c} L.5 ${h-c} Z`;
    svg.setAttribute('viewBox',`0 0 ${w} ${h}`);
    svg.querySelector('path').setAttribute('d',d);
  });
  const f=document.getElementById('frame');
  const fw=f.clientWidth,fh=f.clientHeight,c=16;
  if(fw&&fh){
    f.setAttribute('viewBox',`0 0 ${fw} ${fh}`);
    f.querySelector('path').setAttribute('d',
      `M${c} .5 H${fw-c} L${fw-.5} ${c} V${fh-c} L${fw-c} ${fh-.5} H${c} L.5 ${fh-c} V${c} Z`);
  }
}
dressHud();
addEventListener('resize',dressHud);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(dressHud);

/* rail */
const rail=document.getElementById('rail');
const railItems=SECTIONS.map((s,i)=>{
  const d=document.createElement('div');
  d.className='rail-item mono';
  d.innerHTML=`<span class="sq"></span><span>${s.key}</span>`;
  d.addEventListener('click',()=>{scrollToSection(i);});
  rail.appendChild(d);
  return d;
});
let railState=-1;
function setRail(i){
  if(railState===i)return;
  if(railState>=0)railItems[railState].classList.remove('active');
  railState=i;railItems[i].classList.add('active');
}

/* menu */
const menuNav=document.getElementById('menuNav');
SECTIONS.forEach((s,i)=>{
  const b=document.createElement('button');
  b.innerHTML=`<span class="ix">0${i+1}</span><span class="nm">${s.key}</span>`;
  b.addEventListener('click',()=>{closeMenu();scrollToSection(i);});
  menuNav.appendChild(b);
});
const menuEl=document.getElementById('menu');
document.getElementById('menuBtn').addEventListener('click',()=>menuEl.classList.add('open'));
function closeMenu(){menuEl.classList.remove('open');}
document.getElementById('menuClose').addEventListener('click',closeMenu);
addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu();});
document.getElementById('logoBtn').addEventListener('click',()=>scrollToSection(0));
document.getElementById('chatBtn').addEventListener('click',()=>{});

/* footer swap */
const soundBtn=document.getElementById('soundBtn'),siteUrl=document.getElementById('siteUrl'),
      chatBtn=document.getElementById('chatBtn'),socialRow=document.getElementById('socialRow');
let footMode=false;
function setFootMode(on){
  if(footMode===on)return;footMode=on;
  soundBtn.style.opacity=on?0:1;soundBtn.style.pointerEvents=on?'none':'auto';
  siteUrl.style.opacity=on?1:0;
  chatBtn.style.opacity=on?0:1;chatBtn.style.pointerEvents=on?'none':'auto';
  socialRow.style.opacity=on?1:0;socialRow.style.pointerEvents=on?'auto':'none';
}

/* ============================================================ sound */
let audio=null,soundOn=false;
const soundLbl=document.getElementById('soundLbl');
function buildAudio(){
  const ctx=new (window.AudioContext||window.webkitAudioContext)();
  const master=ctx.createGain();master.gain.value=0;master.connect(ctx.destination);
  const o1=ctx.createOscillator();o1.type='sine';o1.frequency.value=55;
  const g1=ctx.createGain();g1.gain.value=.05;o1.connect(g1).connect(master);
  const o2=ctx.createOscillator();o2.type='sine';o2.frequency.value=110.4;
  const g2=ctx.createGain();g2.gain.value=.028;o2.connect(g2).connect(master);
  const o3=ctx.createOscillator();o3.type='triangle';o3.frequency.value=164.8;
  const g3=ctx.createGain();g3.gain.value=.012;o3.connect(g3).connect(master);
  const len=ctx.sampleRate*3;
  const buf=ctx.createBuffer(1,len,ctx.sampleRate);
  const ch=buf.getChannelData(0);
  for(let i=0;i<len;i++)ch[i]=Math.random()*2-1;
  const noise=ctx.createBufferSource();noise.buffer=buf;noise.loop=true;
  const lp=ctx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=380;lp.Q.value=.8;
  const gn=ctx.createGain();gn.gain.value=.05;
  noise.connect(lp).connect(gn).connect(master);
  const lfo=ctx.createOscillator();lfo.frequency.value=.07;
  const lfoG=ctx.createGain();lfoG.gain.value=.026;
  lfo.connect(lfoG).connect(gn.gain);
  o1.start();o2.start();o3.start();noise.start();lfo.start();
  return {ctx,master};
}
soundBtn.addEventListener('click',()=>{
  if(!audio)audio=buildAudio();
  soundOn=!soundOn;
  audio.ctx.resume();
  audio.master.gain.linearRampToValueAtTime(soundOn?1:0,audio.ctx.currentTime+.9);
  soundLbl.textContent=soundOn?'Sound On':'Sound Off';
  document.body.classList.toggle('sound-on',soundOn);
});

/* ============================================================ virtual scroll */
const UNIT=2300, MAXS=UNIT*6;
let target=0,cur=0;
function scrollToSection(i){target=clamp(i*UNIT+(i?UNIT*.3:0),0,MAXS);}
addEventListener('wheel',e=>{
  e.preventDefault();
  let d=e.deltaY;
  if(e.deltaMode===1)d*=16;else if(e.deltaMode===2)d*=innerHeight;
  target=clamp(target+d,0,MAXS);
},{passive:false});
let ty0=0,tStartTarget=0;
addEventListener('touchstart',e=>{ty0=e.touches[0].clientY;tStartTarget=target;},{passive:true});
addEventListener('touchmove',e=>{
  e.preventDefault();
  target=clamp(tStartTarget+(ty0-e.touches[0].clientY)*2.6,0,MAXS);
},{passive:false});
addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' ')target=clamp(target+UNIT*.45,0,MAXS);
  if(e.key==='ArrowUp'||e.key==='PageUp')target=clamp(target-UNIT*.45,0,MAXS);
});

/* mouse parallax */
const mouse={x:0,y:0,sx:0,sy:0};
addEventListener('pointermove',e=>{
  mouse.x=(e.clientX/innerWidth-.5)*2;
  mouse.y=(e.clientY/innerHeight-.5)*2;
});

/* ============================================================ resize */
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setSize(w,h);
  composer.setSize(w,h);
  gradePass.uniforms.uRes.value.set(w*DPR,h*DPR);
  camera.aspect=w/h;camera.updateProjectionMatrix();
}
addEventListener('resize',resize);resize();

/* ============================================================ main loop */
const clock=new THREE.Clock();
const camPos=new THREE.Vector3(),camTar=new THREE.Vector3();
let started=false;

function frame(){
  requestAnimationFrame(frame);
  const dt=Math.min(clock.getDelta(),.05);
  const time=clock.elapsedTime;

  cur+=(target-cur)*(1-Math.exp(-4.2*dt));
  if(Math.abs(target-cur)<.4)cur=target;
  const p=clamp(cur/UNIT,0,6);
  const idx=Math.min(5,Math.floor(p));
  let t=p-idx; if(idx===5)t=Math.min(t,1);

  document.body.classList.toggle('scrolled',p>.35);

  // fades: hold visible through the dive, vanish only inside the focal object
  const fadeIn = idx===0?1:smooth(0,.07,t);
  const fadeOut= idx===5?1:1-smooth(.93,1,t);
  const fade=fadeIn*fadeOut;
  scenes.forEach((s,i)=>applyFade(s,i===idx?fade:0));

  // camera: normal pose, then dive INTO the focal anchor on exit,
  // and pull back OUT of the next scene's core on entry
  const sc=scenes[idx];
  const pose=sc.pose(t);
  camPos.copy(pose.pos);camTar.copy(pose.tar);
  if(idx<5&&t>.8){
    const dv=Math.pow((t-.8)/.2,2.6);
    const through=sc.anchor.clone().multiplyScalar(2).sub(pose.pos);
    camPos.lerp(sc.anchor,Math.min(1,dv)*.97);
    camTar.lerpVectors(pose.tar,through,dv);
  }
  if(idx>0&&t<.16){
    const zo=1-Math.pow(1-t/.16,2.4);
    const close=sc.anchor.clone().lerp(pose.pos,.18);
    camPos.copy(close.lerp(pose.pos,zo));
    camTar.lerpVectors(sc.anchor,pose.tar,.35+.65*zo);
  }
  camPos.x+=sc.offset;camTar.x+=sc.offset;
  mouse.sx+=(mouse.x-mouse.sx)*(1-Math.exp(-3*dt));
  mouse.sy+=(mouse.y-mouse.sy)*(1-Math.exp(-3*dt));
  camPos.x+=mouse.sx*1.6;camPos.y+=-mouse.sy*1.0;
  camTar.x+=mouse.sx*-.8;camTar.y+=mouse.sy*.5;
  camera.position.copy(camPos);
  camera.lookAt(camTar);

  // per-scene anim + global uniforms
  sc.tick(time,t);
  ANIM_CUBES.forEach(c=>{
    c.mid.rotation.y=-time*.22+c.phase;
    c.mid.rotation.x=Math.sin(time*.16+c.phase)*.22;
    c.core.rotation.y=time*.45+c.phase*2.;
    c.core.rotation.z=time*.18;
  });
  sc.group.traverse(o=>{
    const m=o.material;
    if(m&&m.uniforms){
      if(m.uniforms.uTime)m.uniforms.uTime.value=time;
    }
  });
  camTrackedMats.forEach(m=>{m.uniforms.uCam.value.copy(camera.position);});
  gradePass.uniforms.uTime.value=time;

  // copy + rail + footer
  if(started){
    const showCopy=(idx===0? t<=.78 : t>=.12&&t<=.78)||(idx===5&&t>=.12);
    setCopy(showCopy?idx:-1);
  }
  setRail(clamp(Math.floor(p+.18),0,5));
  setFootMode(p>5.18);

  composer.render();
}
frame();

/* ============================================================ loader sequence */
const ldPct=document.getElementById('ldPct'),ldLabel=document.getElementById('ldLabel'),
      ldFill=document.getElementById('ldFill'),ldCenter=document.getElementById('ldCenter'),
      ldCounts=document.getElementById('ldCounts'),loaderEl=document.getElementById('loader');
const t0=performance.now(),LOAD_MS=2100;
function loadStep(){
  const k=clamp((performance.now()-t0)/LOAD_MS,0,1);
  const e=1-Math.pow(1-k,2.4);
  ldPct.textContent=Math.round(e*100)+'%';
  ldFill.style.transform=`scale(${e})`;ldFill.style.opacity=e*.14;
  if(k<1){requestAnimationFrame(loadStep);return;}
  ldPct.textContent='100%';ldLabel.textContent='100% Loaded';
  setTimeout(()=>{ldLabel.textContent='Ready to Explore';},420);
  setTimeout(()=>{ldCenter.style.opacity=0;ldCounts.classList.add('show');},900);
  setTimeout(()=>{ldCounts.classList.remove('show');},2350);
  setTimeout(()=>{
    loaderEl.classList.add('hide');
    document.body.classList.add('ready');
    started=true;setCopy(0);
  },2900);
}
loadStep();

/* debug hook for screenshot comparison */
window.__ht={set(pp){target=cur=clamp(pp,0,6)*UNIT;},get(){return cur/UNIT;}};
</script>
